[project]
name = "evomem-eval"
version = "0.1.0"
description = "Black-box author provenance evaluation for evomem-mcp-rs"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "httpx>=0.27",
]

[project.scripts]
evomem-eval = "evomem_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
