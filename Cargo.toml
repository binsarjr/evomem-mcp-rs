[package]
name = "evomem-mcp-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
evomem = { git = "https://github.com/anvie/evomem", tag = "v0.4.2" }
rmcp = { version = "3", features = ["transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
